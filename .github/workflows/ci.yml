name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens-only CSS (stylelint, the library's rules)
        run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm build
      - name: No client JS outside the allowed islands
        run: |
          pnpm --silent check:js | tee client-js.txt
          { echo '### Client JS check'; echo '```'; cat client-js.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse accessibility = 100 (both pages, mobile + desktop)
        run: pnpm lighthouse
      - name: Lighthouse scores
        if: always()
        run: |
          { echo '### Lighthouse'; node scripts/lighthouse-summary.mjs .lighthouseci/reports .lighthouseci/reports-desktop; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: |
            dist
            .lighthouseci
            client-js.txt
          if-no-files-found: ignore
          # .lighthouseci/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
